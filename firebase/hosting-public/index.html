<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>PlayerPath</title>
    <!--
      This host (profiles.playerpath.net) exists only to serve recruiting profile
      pages at /p/{shareToken}, which Hosting rewrites to the
      serveRecruitingProfile function. Anyone landing on the root wanted the
      marketing site.
    -->
    <meta http-equiv="refresh" content="0; url=https://playerpath.net" />
    <style>
      :root { color-scheme: light dark; --bg:#faf8f5; --text:#1c1c1e; --accent:#357a57 }
      @media (prefers-color-scheme: dark) { :root { --bg:#111; --text:#f2f2f7 } }
      body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif }
      .wrap { max-width:420px; margin:18vh auto; text-align:center; padding:0 20px }
      a { color:var(--accent) }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p>Redirecting to <a href="https://playerpath.net">playerpath.net</a>…</p>
    </div>
  </body>
</html>
